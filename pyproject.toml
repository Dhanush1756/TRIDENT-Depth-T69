[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trident-depth"
version = "0.1.0"
description = "TRIDENT-Depth T69: reproducible depth data pipelines"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "Pillow>=10.2,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
classical = ["scipy>=1.15,<2", "opencv-python-headless>=4.11,<4.12"]
learning = ["torch>=2.6,<3"]
app = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1"]
test-app = ["httpx>=0.28,<1"]
nyu = ["h5py>=3.15,<4", "scipy>=1.15,<2"]

[project.scripts]
trident-prepare = "trident_depth.cli:main"

[tool.setuptools.packages.find]
include = ["trident_depth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
